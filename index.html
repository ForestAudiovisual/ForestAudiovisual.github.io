<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{min-height:100%;background:#000;color-scheme:dark}
body{position:relative;background:#000;color:#fff;min-height:100vh;min-height:100svh;display:flex;justify-content:center;align-items:center;overflow-x:hidden;font-family:"Courier New",Courier,monospace;-webkit-tap-highlight-color:transparent}

/* FONDO GLITCH MONOCROMÁTICO */
.glitch-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(255,255,255,.035) 4px)}
.glitch-bg::before{content:"";position:absolute;inset:-50%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");opacity:.10;animation:ruido .2s steps(2) infinite}
.glitch-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(255,255,255,.12) 45.2%,transparent 45.8%),linear-gradient(90deg,transparent 20%,rgba(255,255,255,.08) 20.2%,transparent 20.5%);animation:interferencia 7s infinite steps(1)}
@keyframes ruido{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}
@keyframes interferencia{0%,85%,100%{opacity:0;transform:translateX(0)}86%{opacity:1;transform:translateX(15px)}87%{opacity:0}91%{opacity:.8;transform:translateX(-20px)}92%{opacity:0}}
.bloques{position:fixed;inset:0;pointer-events:none;z-index:1}
.bloques span{position:absolute;background:#fff;opacity:0;animation:bloquesGlitch 8s infinite steps(1)}
.bloques span:nth-child(1){top:22%;left:10%;width:120px;height:2px}
.bloques span:nth-child(2){top:67%;right:15%;width:80px;height:5px;animation-delay:2s}
.bloques span:nth-child(3){top:40%;right:8%;width:3px;height:60px;animation-delay:4s}
.bloques span:nth-child(4){bottom:20%;left:25%;width:160px;height:3px;animation-delay:5s}
@keyframes bloquesGlitch{0%,89%,100%{opacity:0}90%{opacity:.8;transform:translateX(12px)}91%{opacity:0}93%{opacity:.5;transform:translateX(-8px)}94%{opacity:0}}

/* CONTENIDO PRINCIPAL */
.contenedor{position:relative;z-index:5;width:min(680px,86vw);padding:48px 0 38px;text-align:center;display:flex;flex-direction:column;align-items:center}
h1{font-size:64px;font-weight:normal;letter-spacing:2px;margin-bottom:26px;animation:fallo 5s infinite}
@keyframes fallo{0%,8%,10%,12%,50%,52%,54%,100%{opacity:1;text-shadow:0 0 3px #fff}9%,11%{opacity:.15;text-shadow:none}51%{opacity:.4;text-shadow:none}53%{opacity:.05;text-shadow:none}55%{opacity:.8;text-shadow:0 0 5px #fff}70%{opacity:.9}71%{opacity:.2}73%{opacity:1}}
.enlaces{display:flex;flex-direction:column;gap:10px;margin-bottom:34px}
.enlaces a{color:#fff;text-decoration:none;font-size:15px;letter-spacing:1px;transition:opacity .3s}
.enlaces a:hover{opacity:.5}

/* DISPOSITIVO: ESCALA DE DO */
.device{width:100%;max-width:560px;padding:0 4px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300}
#bar{position:relative;width:100%;height:76px;touch-action:none;cursor:ew-resize;outline:none}
#bar:focus-visible{outline:1px solid rgba(255,255,255,.28);outline-offset:6px}
.line{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.28)}
#fill{position:absolute;left:0;top:50%;height:1px;width:0;background:#fff;transition:width .08s}
.tick{position:absolute;top:50%;width:1px;height:16px;margin-top:-8px;background:rgba(255,255,255,.28)}
#thumb{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;left:6.25%;transition:left .08s,transform .15s}
#bar.on #thumb{transform:scale(1.35)}
#hint{margin-top:8px;text-align:center;color:rgba(255,255,255,.38);letter-spacing:.12em;text-transform:uppercase;font-size:10px;transition:opacity .6s;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#hint.hide{opacity:0}
@media(max-width:600px){h1{font-size:48px}.contenedor{padding:36px 0 28px}.enlaces{margin-bottom:24px}#bar{height:68px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glitch-bg" aria-hidden="true"></div>
<div class="bloques" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<main class="contenedor">
  <h1>Forest</h1>
  <nav class="enlaces" aria-label="Enlaces de Forest">
    <a href="https://forestaudiovisual.bandcamp.com/" target="_blank" rel="noopener noreferrer">bandcamp</a>
    <a href="https://www.youtube.com/@forest_audiovisual" target="_blank" rel="noopener noreferrer">youtube</a>
  </nav>

  <section class="device" aria-label="Dispositivo sonoro: escala de Do mayor">
    <div id="bar" role="slider" tabindex="0" aria-label="Escala de Do mayor" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1" aria-valuetext="Do">
      <div class="line"></div><div id="fill"></div><div id="thumb"></div>
    </div>
    <div id="hint">Deslizá el dedo</div>
  </section>
</main>

<script>

const NOTES=[['Do',261.63],['Re',293.66],['Mi',329.63],['Fa',349.23],['Sol',392],['La',440],['Si',493.88],['Do',523.25]];
const $=id=>document.getElementById(id),bar=$('bar'),thumb=$('thumb'),fill=$('fill'),hint=$('hint');
NOTES.forEach((n,i)=>{const t=document.createElement('div');t.className='tick';t.style.left=((i+.5)/8*100)+'%';bar.appendChild(t)});
let ctx,osc,osc2,ns,gs,bp,ng,og,ws,filt,amp,dly,wet,idx=-1,active=false;
const D={mix:35,tm:35};
function init(){
  if(ctx){if(ctx.state!=='running')ctx.resume();return}
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  osc=ctx.createOscillator();osc.type='sawtooth';
  osc2=ctx.createOscillator();osc2.type='square';osc2.detune.value=9;
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  ns=ctx.createBufferSource();ns.buffer=nb;ns.loop=true;
  bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=2;
  ng=ctx.createGain();ng.gain.value=2.2;og=ctx.createGain();og.gain.value=1;
  ws=ctx.createWaveShaper();const cv=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;cv[i]=Math.max(-1,Math.min(1,x*20))}ws.curve=cv;
  filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=1800;const sh=ctx.createBiquadFilter();sh.type='lowshelf';sh.frequency.value=150;sh.gain.value=14;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200;const hg=ctx.createGain();hg.gain.value=0.7;
  const gb=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),gdt=gb.getChannelData(0);
  for(let i=0;i<gdt.length;){const len=20+Math.floor(Math.random()*Math.random()*ctx.sampleRate*0.012),on=Math.random()<0.45,a=0.3+Math.random()*0.7;for(let j=0;j<len&&i<gdt.length;j++,i++)gdt[i]=on?(Math.random()*2-1)*a:0}
  gs=ctx.createBufferSource();gs.buffer=gb;gs.loop=true;
  amp=ctx.createGain();amp.gain.value=0;
  osc.connect(og);osc2.connect(og);og.connect(ws);ns.connect(bp);bp.connect(ng);ng.connect(ws);ws.connect(filt);filt.connect(sh);sh.connect(amp);gs.connect(hp);hp.connect(hg);hg.connect(amp);amp.connect(ctx.destination);
  dly=ctx.createDelay(1.5);dly.delayTime.value=0.08+D.tm/100*0.72;
  const fb=ctx.createGain(),lp=ctx.createBiquadFilter();fb.gain.value=0.45;lp.type='lowpass';lp.frequency.value=2200;
  wet=ctx.createGain();wet.gain.value=D.mix/100*0.8;
  amp.connect(dly);dly.connect(lp);lp.connect(fb);fb.connect(dly);lp.connect(wet);wet.connect(ctx.destination);
  osc.start();osc2.start();ns.start();gs.start();
}
function show(i){
  thumb.style.left=((i+.5)/8*100)+'%';fill.style.width=((i+.5)/8*100)+'%';
  
  bar.setAttribute('aria-valuenow',i+1);bar.setAttribute('aria-valuetext',NOTES[i][0]);
}
function setF(f,tc){f/=16;const t=ctx.currentTime;osc.frequency.setTargetAtTime(f,t,tc);osc2.frequency.setTargetAtTime(f*1.498,t,tc);bp.frequency.setTargetAtTime(f*8,t,tc)}
function setNote(i){
  if(i===idx)return;idx=i;show(i);
  if(ctx)setF(NOTES[i][1],0.012);
}
function start(){active=true;bar.classList.add('on');hint.classList.add('hide');amp.gain.setTargetAtTime(0.14,ctx.currentTime,0.012)}
function stop(){active=false;bar.classList.remove('on');if(ctx)amp.gain.setTargetAtTime(0,ctx.currentTime,0.08)}
function fromX(x){const r=bar.getBoundingClientRect();return Math.max(0,Math.min(7,Math.floor((x-r.left)/r.width*8)))}
bar.addEventListener('pointerdown',e=>{e.preventDefault();init();bar.setPointerCapture(e.pointerId);const i=fromX(e.clientX);idx=-1;setF(NOTES[i][1],0.001);setNote(i);start()});
bar.addEventListener('pointermove',e=>{if(active)setNote(fromX(e.clientX))});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>bar.addEventListener(t,stop));
bar.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();init();
  const i=Math.max(0,Math.min(7,(idx<0?0:idx)+(e.key==='ArrowRight'?1:-1)));
  setNote(i);start();clearTimeout(bar._t);bar._t=setTimeout(stop,350);
});



show(0);

</script>
</body>
</html>
